<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluador Claude Code</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <div class="brand-mark">CC</div>
        <strong>Claude Code Evaluator</strong>
      </div>
      <h1>Evaluación de habilidades Fullstack</h1>
      <p class="lead">
        Diagnóstico de Claude Code y asistencia de IA. Completa tus datos para iniciar el cuestionario.
      </p>
      <form method="post" action="/start-eval">
        <label for="dev_name">Nombre completo del desarrollador</label>
        <input id="dev_name" name="dev_name" type="text" required placeholder="Ej. Ana Pérez">

        <label for="dev_role">Rol</label>
        <select id="dev_role" name="dev_role" required>
          <option value="" disabled selected>Selecciona un rol</option>
          <option>Desarrollador Fullstack</option>
          <option>Tech Lead</option>
          <option>Junior</option>
          <option>Backend Engineer</option>
          <option>Frontend Engineer</option>
          <option>DevOps / Platform</option>
        </select>

        <button class="btn" type="submit">Iniciar Evaluación</button>
      </form>
    </section>
  </main>
</body>
</html>
